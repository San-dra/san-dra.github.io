# _quarto.yml
project:
  type: website
  output-dir: ../content

website:
  title: "{{ project_title }}"  # 🔶 REPLACE with actual project title
  navbar:
    left:
      - text: "Home"
        href: index.html
    right:
      - icon: github
        href: "{{ github_url }}"   # 🔶 REPLACE with actual repo URL

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    mainfont: "Fira Sans"
    monofont: "Fira Code"
    smooth-scroll: true
    grid:
      sidebar-width: 250px
      body-width: 960px
      margin-width: 300px
    link-external-newwindow: true
