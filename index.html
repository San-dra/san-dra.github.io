<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sandra's Portfolio</title>
      
        <!-- 🔽 Add this line before your script -->
        <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
      
        <link rel="stylesheet" href="assets/css/home.css">
        <script src="assets/js/home.js" defer></script>
      </head>
      
<body>
  <header class="hero" id="hero">
    <!-- Hero content from home_meta.yaml will be injected here -->
  </header>

  <main>
    <section id="projects">
      <h2>Highlighted Projects</h2>
      <div class="card-grid" id="project-cards">
        <!-- Highlighted projects will be injected here from home.yaml -->
      </div>
    </section>

    <section id="blogs">
      <h2>Latest Blog Posts</h2>
      <div class="card-grid" id="blog-cards">
        <!-- Latest blogs will be injected here from home.yaml -->
      </div>
    </section>
  </main>

  <footer>
    <div id="footer-contact">
      <!-- Contact info from home_meta.yaml will be injected here -->
    </div>
  </footer>
</body>
</html>
